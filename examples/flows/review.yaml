kind: dag
name: review
description: |
  Domain-agnostic review: scout → planner → specialist swarm → verifier → synthesizer.
  The scout classifies the project domain and content types. The planner
  selects personas from the full catalog based on what the scout found.
  Specialists must output structured JSON findings. The verifier re-reads
  cited files to filter hallucinated findings before synthesis.
  Works on any project: code, legal, financial, scientific, documentation.

parameters:
  target_dir:
    type: string
    description: Root directory of the project to review

tasks:
  - id: scout
    specialist: analyst
    model: auto
    mandate: |
      You are a project classifier. Your ONLY job is to examine the
      project at {{ target_dir }} and output a JSON classification.

      Use list_directory to see the top-level structure. For large
      projects, do NOT use directory_tree on the root — it may exceed
      context limits. Instead, list_directory on subdirectories.
      Read the README and 1-2 config files (package.json, Cargo.toml,
      pyproject.toml, go.mod, or equivalent).

      Output ONLY this JSON object — no prose, no questions, no
      commentary:
      {
        "domain": "software|legal|financial|scientific|documentation|mixed",
        "languages": ["rust", "python", ...],
        "frameworks": ["MCP", "Django", ...],
        "content_types": ["source code", "contracts", "reports", ...],
        "file_count": N,
        "structure_summary": "brief description of how the project is organized",
        "key_files": ["path/to/important/file", ...],
        "review_focus": ["security", "correctness", "compliance", ...]
      }

      Be factual. Only report what you observe in the actual files.
      Do NOT introduce yourself. Do NOT ask questions. Do NOT offer help.
    expected_output: JSON classification of project domain and structure

  - id: planner
    specialist: analyst
    model: auto
    depends_on: [scout]
    generates_tasks: true
    mandate: |
      You are a review planner. Read the scout's project classification,
      then design a review plan by selecting the right personas and
      models for each task.

      STEP 1: Call personas_list to see all available personas.

      STEP 2: Call models_list to see available models with their
      capabilities (tool_use, reasoning, speed_tier, json_compliance).

      STEP 3: Based on the project domain and content types from the
      scout, select 4-6 personas that are relevant. Match personas to
      the project — do NOT use code-focused personas on a legal project.

      Examples of persona-domain matching:
      - Software project → principal_engineer, software_developer,
        security_sentinel, tech_writer, assessor
      - Legal project → analyst, ethics_compliance_officer,
        researcher, tech_writer, devils_advocate
      - Financial project → financial_analyst, analyst,
        ethics_compliance_officer, assessor, watchdog
      - Scientific → researcher, data_scientist, analyst,
        tech_writer, assessor
      - Mixed → pick based on what content types are present

      STEP 4: Create 8-12 review tasks. Each task must have:
      - "id": unique identifier (e.g., "arch-01", "quality-01")
      - "specialist": a persona name EXACTLY as shown in personas_list
      - "model": pick from models_list based on the task:
        - Tasks needing deep analysis → model with extended reasoning
        - Tasks needing fast file scanning → fastest model
        - Use "auto" only if no model cards have capability metadata
      - "mandate": specific review instructions (under 300 words).
        Name the exact files to read and what to check.
        Do NOT include output format instructions — the engine adds
        them automatically.

      Distribute tasks across the selected personas. Every major
      area of the project should be covered by at least one task.

      Output ONLY the JSON array of tasks.
    expected_output: JSON array of 8-12 tasks with dynamically selected personas

  - id: verify
    specialist: assessor
    model: auto
    depends_on: [planner]
    mandate: |
      You are a finding verifier. Your job is to check whether specialist
      findings are real by re-reading the cited source files.

      STEP 1: Read all specialist outputs via flow_result.

      STEP 2: For each finding that cites a file and line number:
      - Read the cited file using read_file or read_text_file
      - Check if the code at that line matches the finding's claim
      - Verdict: CONFIRMED (code has exactly this issue),
        PLAUSIBLE (concern is reasonable but overstated),
        HALLUCINATED (finding doesn't match actual code)

      STEP 3: For findings without file/line citations, mark as
      UNVERIFIABLE.

      Output ONLY a JSON array of verified findings:
      [
        {
          "original_id": "the specialist task id",
          "file": "path",
          "line": N,
          "severity": "high|medium|low",
          "issue": "original issue text",
          "verdict": "CONFIRMED|PLAUSIBLE|HALLUCINATED|UNVERIFIABLE",
          "reason": "why this verdict"
        }
      ]

      Drop any HALLUCINATED findings. Keep CONFIRMED, PLAUSIBLE,
      and UNVERIFIABLE.

      Do NOT describe findings. Do NOT ask questions. Output ONLY JSON.
    expected_output: JSON array of verified findings

  - id: synthesize
    specialist: summarizer
    model: auto
    depends_on: [verify]
    mandate: |
      Read the verifier output via flow_result. It contains verified
      findings with verdicts (CONFIRMED, PLAUSIBLE, UNVERIFIABLE).

      Produce a structured review report:

      ## Executive Summary
      3-5 sentences: what kind of project this is, overall quality
      assessment, and the most critical confirmed findings.

      ## Confirmed Findings
      Findings verified against source code. Include file, line,
      severity, and the verifier's confirmation.

      ## Plausible Findings
      Concerns that are reasonable but not fully verified.

      ## Action Items
      Top 10 items from confirmed findings, prioritized by severity.

      ## Methodology
      Which personas were used, how many findings were produced,
      how many survived verification.

      Be thorough. Read EVERY verified finding before writing.
      Do NOT include hallucinated findings — they were already dropped.
    expected_output: Comprehensive review report with verification status
