[package]
name = "navra-modal-voice"
description = "Voice I/O module for navra (ASR + TTS)"
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
navra-core = { path = "../navra-core", default-features = false }
navra-mcp = { path = "../navra-mcp", default-features = false }
navra-macros = { path = "../navra-macros" }
navra-protocol = { path = "../navra-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
cpal = { version = "0.15", optional = true }

[features]
default = ["onnx", "audio"]
onnx = ["navra-core/onnx", "navra-mcp/onnx"]
## Microphone/speaker device I/O via cpal (ALSA on Linux). Off in
## headless/container builds; pure-DSP helpers always compile.
audio = ["dep:cpal"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
