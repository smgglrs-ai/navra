# cargo-deny configuration for the navra workspace.
#
# Policy: no vulnerability (RUSTSEC "vulnerability" / "unsound" with a
# fix available) may be ignored. Ignoring a vulnerability requires
# removing the entry and fixing the dependency instead. The `ignore`
# list below is restricted to advisories with no safe upgrade path
# (unmaintained crates locked in by transitive dependencies we cannot
# bump without breaking changes upstream of us).

[licenses]
version = 2
# The allowlist covers exactly the license expressions present in the
# locked dependency tree (verified with `cargo deny list` on
# 2026-11-18). Everything in the tree is a permissive license; there
# are no GPL/AGPL/EPL obligations. Notes on the less-common entries:
# - LGPL-2.1-or-later appears only as one OR-alternative in r-efi
#   ("MIT OR Apache-2.0 OR LGPL-2.1-or-later"), which is satisfied by
#   the MIT/Apache-2.0 entries, so LGPL itself is NOT allowed.
# - CDLA-Permissive-2.0 covers the webpki-root-certs/webpki-roots
#   certificate bundles (Mozilla root store data).
# - Unlicense entries are all "Unlicense OR MIT" dual-licensed crates.
# - Unicode-3.0 covers the ICU4X family and unicode-ident data tables.
# When adding a dependency that introduces a new license, extend this
# list deliberately in the same commit — never blanket-add.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# Unpublished crates. Note: this exempts ANY crate with no license
# field that cargo-deny considers unpublished (`publish = false`,
# unpublished version, or path-only source) — not just
# workspace-internal crates. Containment: the [sources] section
# denies unknown registries and git sources, so an unpublished
# crate reaching this exemption must come from the local workspace
# or crates.io-published metadata, not an arbitrary source.
private = { ignore = true }
confidence-threshold = 0.93

[bans]
# Disallow multiple versions of the same crate unless deliberately
# duplicated (some duplication is locked in by the ort/tokio stacks).
multiple-versions = "warn"
# The workspace convention is versionless `path = "../..."` deps
# between crates, which cargo-deny counts as wildcards. Every
# external dependency is version-resolved via Cargo.lock, so
# wildcards here are only intra-workspace path deps.
#
# Wildcard version requirements: external wildcards are DENIED;
# intra-workspace versionless `path = "../..."` deps are exempt via
# `allow-wildcard-paths` because every workspace crate is marked
# `publish = false` (crates are consumed from this repository only).
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only crates.io and our own path/git workspace deps are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"

# Each entry below is a tracked, deliberate exception. Every one is an
# "unmaintained" advisory (not an exploitable vulnerability). Remove
# the entry as soon as the dependency chain offers a maintained
# replacement.

ignore = [
    # `instant` is unmaintained. Pulled in transitively via ratatui
    # (crossterm) in the navra-tui/navra-model stack. No maintained
    # drop-in release exists; the crate is a no-op passthrough on
    # modern platforms (std::time since 1.60). Unused on Linux targets.
    "RUSTSEC-2024-0384",

    # `paste` is no longer maintained. Transitively required by
    # ratatui/navra-model. Macro-only crate, no runtime code, no
    # fixed/affected versions - unmaintained only.
    "RUSTSEC-2024-0436",

    # `unsafe-libyaml` is unmaintained. Vendored C in serde_yaml,
    # which is itself unmaintained; serde_yaml is still required by
    # navra-cognitive. Unmaintained only - no known vulnerability.
    "RUSTSEC-2024-0449",

    # `rustls-pemfile` is unmaintained. The functionality moved into
    # rustls-pki-types; still pulled in transitively by the rustls
    # ecosystem (rcgen for local TLS certificates). Unmaintained only.
    "RUSTSEC-2025-0134",

    # The zbus/zvariant family (zvariant, zbus_names, zvariant_derive)
    # is unmaintained following upstream's archive. Required by
    # keyring/secret-service (Linux credential storage) and ksni (tray
    # icon). No maintained fork is published on crates.io yet.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",

    # `chrono` is unmaintained (chronotope announced the project is no
    # longer maintained). Deeply embedded across the dependency graph
    # (dsntk FEEL evaluator, tokenizers, oauth2, ...). The jiff
    # migration is a workspace-wide source change, out of scope for a
    # dependency bump. Unmaintained only - no vulnerability.
    "RUSTSEC-2026-0543",

    # `chrono-tz` is unmaintained (same chronotope announcement).
    # Required by dsntk-feel-temporal. Unmaintained only.
    "RUSTSEC-2026-0555",
]
