id: NAVRA-162
title: "CLI restructuring and systemd service architecture"
status: done
priority: high
effort: 5-10d
tags: [architecture, cli, systemd, triggers]
depends_on: [NAVRA-161]
description: |
  Restructured the CLI to reflect navra's architecture with
  separate command groups instead of a monolithic daemon:

  - `navra mcp serve|stdio` — MCP gateway (replaces navra serve)
  - `navra agent run` — agentic loop (split from navra run)
  - `navra flow run|list|trigger` — flow execution and triggers
  - Old commands kept as hidden deprecated aliases with hints

  Process lifecycle delegated to systemd instead of reimplementing
  daemonization. Multi-service architecture:

  - navra.target groups all services
  - navra-mcp.service — MCP gateway
  - navra-model.service — model inference server
  - navra-triggers.service — flow trigger engine

  Agent instance configs at ~/.config/navra/agents/*/config.toml
  can now declare [[triggers]] that are loaded by the trigger
  engine alongside main config.toml triggers.

  Design decision: no `navra daemon` command. systemd handles
  start/stop/status/detach/restart/logs — reimplementing that
  in Rust adds complexity with zero benefit on Linux.
acceptance:
  - navra mcp serve starts the MCP gateway
  - navra mcp stdio starts stdio transport
  - navra agent run executes an agentic loop
  - navra flow run executes a flow file
  - navra flow trigger list shows triggers from config + instances
  - navra flow trigger start starts the trigger engine
  - navra flow list shows available flows
  - navra serve/stdio/run still work with deprecation hints
  - systemd multi-service setup (navra.target)
  - navra install deploys all systemd units
  - 22 new tests pass, no regressions
