id: NAVRA-180
title: "IFC taint visibility at OpenShell egress proxy"
status: blocked
priority: high
effort: 1-2d (navra side) + OpenShell RFC
depends_on: []
feeds: ["NAVRA-179"]
source: OPENSHELL.md gap analysis (2026-07-28)
tags: [security, openshell, ifc]
relates: |
  OpenShell issue #2378 (supervisor-owned MCP response
  isolation/declassification, state:stale since 2026-10-18) is the
  complementary direction — inbound response gating vs the PIP's
  outbound state flow; they compose, neither implements the other.
  navra itself is a working reference implementation of #2378's
  invariant list at the MCP application layer (discovery bounds,
  scanner/manifests, redaction + IFC declassification modes, tool
  ACLs/disclosure, fail-closed behaviors — the NAVRA-186/187
  security-wiring work). Engaging on #2378 may be a lower-friction
  OpenShell community entry point than the PIP RFC; the undecodable
  -response hang found in NAVRA-187 is directly relevant to its
  "malformed responses fail closed" invariant.
blocked_reason: |
  Requires an accepted upstream OpenShell RFC for the Policy
  Information Point interface.

  PROTOTYPE EXISTS (2026-10-30): branch feat/policy-information-point
  in the local OpenShell fork (~/Code/github.com/NVIDIA/OpenShell)
  carries a supervisor-side implementation (~1050 lines, RFC 0019 +
  proto/pip.proto + crates/openshell-supervisor-network/src/pip.rs +
  OPA input.pip injection at all five evaluation points + 8 passing
  tests) and the RFC carried over as rfc/0019 (correctly renumbered,
  authors @fdupont, issue link TODO). Reviewed 2026-10-30: faithful
  to the design (supervisor-initiated streams, SO_PEERCRED + TOFU
  SHA256 verification gating the RPC, disconnect/empty = null,
  deny-only in the baked policy with a dedicated deny reason, socket
  dir 0750, one clippy lint fixed in 20653d285). Gaps, in priority
  order: (1) deny-only is enforced only in the baked policy — the
  RFC's validator requirement (reject input.pip references in
  authored allow rules) is unimplemented, acknowledged in the
  branch README as a prototype follow-up; (2) non-Linux builds skip
  identity verification entirely (cfg gate returns Ok) — should
  refuse to connect instead of failing open; (3) merge semantics
  are lexicographic-by-pip-name, not the RFC's latest-writer-wins
  (deterministic, but the doc and the test name say otherwise).
  The navra-side publisher is still unwritten; the branch's mock
  publisher (pip.rs tests) is the template.

  Review fixes landed on the branch (b558860e7): non-Linux builds
  now refuse to connect instead of skipping identity verification
  (fail-closed, terminal error), and the merge semantics are
  documented as deterministic lexicographic-by-publisher-name in
  the RFC, merged() docs, and the test (was mislabeled
  latest-writer-wins). The upstream feature-request issue draft is
  ready at docs/openshell/issue-policy-information-point.md
  (written against OpenShell's feature_request.yml template —
  personal user story, workflow-level design, acceptance criteria,
  alternatives incl. the middleware-composition rejection, agent
  investigation findings, and an offer to contribute the RFC +
  prototype). Submission sequence: file the issue, maintainers
  decide on the RFC number, then the RFC 0019 + implementation
  from the branch become the PRs.

  Upstream sequencing remains: feature issue first (maintainers
  assign the RFC number), then the RFC, then this implementation as
  the PR. The branch is the ready payload.

  TOPOLOGY CORRECTION (2026-10-30): navra is NOT deployed inside
  OpenShell sandboxes. The actual topology (the one
  docs/openshell/opa-sandbox-policy.rego implements) is navra as an
  external gateway: agent inside the sandbox, egress proxy allows
  exactly the navra gateway + model endpoint + OpenShell gateway.
  The original item and RFC assumed the architecture doc's Mode 1
  (navra inside alongside the agent), which is a taxonomic mode, not
  the deployment. Consequences, resolved 2026-10-30:

  - navra cannot create a socket inside the sandbox's mount
    namespace, so /run/openshell/pip/navra.sock is unreachable —
    but this is a DISCOVERY-path constraint, not a mechanical one:
    wherever navra and the supervisor share a filesystem view
    (same host), navra binds a supervisor-visible socket and the
    prototype's SO_PEERCRED → /proc/<pid>/exe → SHA256 TOFU chain
    works verbatim (the supervisor's /proc view already spans
    sandbox processes; that is how per-connection binary identity
    works).
  - Design settled as "one PIP contract, two publisher sources":
    in-sandbox sockets for untrusted frameworks (zero-config
    discovery, TOFU), operator-configured endpoints for operator
    infrastructure like navra (config-time authorization, same
    StreamContext/cache/input.pip/deny-only; Unix socket same-host,
    authenticated network endpoint for Kubernetes, mirroring
    middleware registration). Both RFC copies and the issue draft
    were rewritten on this basis.
  - The branch prototype implements the in-sandbox class only; the
    operator-side dialer (supervisor-side directory watch + configured
    endpoints) is follow-up implementation on the same branch.
  - The middleware-composition alternative analysis was also
    corrected: with navra external, a host-side middleware CAN reach
    it directly — the rejection now rests on failure semantics
    (fail_closed = gateway is a hard egress dependency; fail_open =
    tainted traffic released when the gateway is down; PIP degrades
    to baseline), hot-path blocking queries vs streamed state, and
    endpoint-scoped chains vs sandbox-wide context.
  - Remaining hard problem either way: sandbox↔session correlation
    (navra keys taint per agent session; the per-sandbox
    StreamContext needs a sandbox→session map, most naturally a
    provisioning-time credential binding).

  Verified 2026-10-30: the draft RFC
  (docs/openshell/rfc-0002-policy-information-point.md) was never
  submitted — no PIP discussion, issue, or RFC exists upstream
  (checked discussions, issues, and the rfc/ directory). Two stale
  assumptions in the draft need fixing before submission:

  1. OpenShell's RFC process now starts with a GitHub issue
     (feature request template); maintainers assign the RFC number
     only if they decide broad review is needed. "GitHub Discussion
     submission" is no longer the entry point, and the local "0002"
     number is navra-side numbering (upstream RFC 0002 is
     agent-driven-policy-management) — any submission gets a
     maintainer-assigned number.

  2. Upstream has since merged RFC 0009 (supervisor middleware,
     2026-07): L7 traffic inspection that can inspect/deny/replace
     HTTP bodies and WebSocket text. Adjacent but not equivalent —
     middleware sees traffic content, the PIP is a
     supervisor-initiated query of in-sandbox application security
     state feeding OPA input as deny-only context. The draft must be
     repositioned against 0009 as complementary, or reviewers will
     ask why middleware is insufficient.

  Next step: refresh the draft (drop the number, reposition vs
  RFC 0009, note the issue-first process), then file the upstream
  feature-request issue. The 1-2d navra-side work starts only after
  upstream acceptance.

  Capability check (2026-10-30): OpenShell has NOT independently
  built the PIP capability — verified against the web docs AND the
  source at ~/Code/github.com/NVIDIA/OpenShell (clean clone at
  3a5dfcd2f, 2026-10-30). Source-level specifics: OPA input is
  built per-request from network/L7 context (NetworkInput {
  binary_path, host, port }; l7_request_policy_input; opa.rs),
  the supervisor's only dial-into-sandbox connection is the SSH
  relay Unix socket with peer-PID verification (supervisor_session.rs
  ~1192), and the "governance" code hits are gateway-interceptor
  config test fixtures plus examples/governance-interceptor —
  control-plane RPC interception, not egress. What shipped instead,
  and why none of it covers the gap:

  - Supervisor middleware (RFC 0009, shipped): content-driven — the
    supervisor calls operator-registered host-side gRPC services with
    request/response bodies for per-request allow/deny/transform. No
    query of in-sandbox application state, and middleware services
    run outside the sandbox.
  - OPA input: built per-request from request/L7 context
    (l7_request_policy_input); Rego data files are static/local. No
    runtime application-state injection path.
  - Sandbox service exposure (`service expose`, RFC 0017 draft):
    inbound ingress through the gateway relay — not a supervisor
    control-plane query, and RFC 0017 explicitly lists replacing
    egress policy as a non-goal.
  - OpenShell-Research "Egress Gate": external request evaluator the
    supervisor consults — closest in shape, but still content-driven
    and a research artifact, not the product.
  - Detection findings (OCSF) and dynamic policy updates are
    telemetry and control-plane revisions respectively, not policy
    inputs from inside the sandbox.

  Also checked for generic-gap artifacts and alternative hooks
  (2026-10-30): no issue or PR describes the gap in any phrasing
  (searched by PIP name and by generic terms — application state,
  runtime context, external data, OPA input extension, governance
  query). The nearest artifacts are the middleware issue #1733
  threads, where maintainers discuss "trusted middleware / guard
  service" shapes and ATR-style rule evaluation at the egress hook —
  adjacent thinking, but nobody has asked for in-sandbox governance
  state to influence egress policy.

  Generic-hook analysis — a TODAY workaround exists, and the RFC's
  alternatives section must address it: operator middleware (RFC
  0009) receives RequestContext { sandbox_id, originating process }
  plus request content per egress request, so a bespoke "taint
  guard" middleware could query navra inside that sandbox (reachable
  via service expose + the isolation-backend LoopbackConnect, which
  the source confirms exists) and deny on taint. But the composition
  is strictly worse than the PIP: (a) wrong failure semantics —
  middleware fail_closed makes navra a hard dependency on ALL
  egress and fail_open lets tainted traffic through when navra is
  down, while the PIP degrades to the baseline allowlist on
  disconnect; (b) per-request synchronous side-query through the
  gateway relay vs the PIP's supervisor-held streamed state; (c) no
  supervisor verification of the responder's binary identity. The
  LoopbackConnect transport also proves the PIP's plumbing is
  feasible upstream — only the policy-time query semantics are
  missing.

  Additional positioning insight for the draft refresh: the
  architecture docs state the trust principle "the sandbox ... never
  makes policy decisions." The strongest reviewer objection to the
  PIP is this principle, not middleware — the draft must lead with
  its existing mitigations (deny-only context, supervisor verifies
  the responder, PIP disconnect = baseline policy unchanged). The
  middleware issue threads show maintainers actively discussing
  "trusted guard service" shapes at the egress hook, so the audience
  is receptive.
description: |
  navra's IFC taint labels travel as MCP-level metadata. OpenShell's
  egress proxy cannot see them. A tainted response could be
  exfiltrated via a non-MCP channel that OpenShell allows.

  navra-side work (1-2 days once RFC is accepted):
  - Expose PolicyInformationPoint gRPC service on a supervisor-
    visible endpoint (same-host Unix socket; configured network
    endpoint for Kubernetes deployments)
  - Stream taint context (data_classification, trust_state) from
    navra's TaintTracker to the supervisor, keyed by sandbox_id
  - Supervisor injects into OPA input.pip for deny rules
  - Correlation binding: map agent credentials to sandbox ids at
    provisioning so the per-sandbox StreamContext resolves

  RFC draft: docs/openshell/rfc-0002-policy-information-point.md
acceptance:
  - navra exposes PIP gRPC service on an operator-side (supervisor-
    visible or configured) endpoint; the in-sandbox socket path does
    not apply — navra is deployed as an external gateway, not inside
    the sandbox
  - Supervisor queries and injects taint into OPA input
  - Integration test: tainted data blocked at proxy
scope:
  - navra-server/src/ (PIP service)
  - docs/openshell/rfc-0002-policy-information-point.md
verification:
  quick: just test-server
