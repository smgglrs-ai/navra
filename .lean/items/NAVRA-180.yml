id: NAVRA-180
title: "IFC taint visibility at OpenShell egress proxy"
status: blocked
priority: high
effort: 1-2d (navra side) + OpenShell RFC
depends_on: []
feeds: ["NAVRA-179"]
source: OPENSHELL.md gap analysis (2026-07-28)
tags: [security, openshell, ifc]
blocked_reason: |
  Requires an accepted upstream OpenShell RFC for the Policy
  Information Point interface.

  Verified 2026-10-30: the draft RFC
  (docs/openshell/rfc-0002-policy-information-point.md) was never
  submitted — no PIP discussion, issue, or RFC exists upstream
  (checked discussions, issues, and the rfc/ directory). Two stale
  assumptions in the draft need fixing before submission:

  1. OpenShell's RFC process now starts with a GitHub issue
     (feature request template); maintainers assign the RFC number
     only if they decide broad review is needed. "GitHub Discussion
     submission" is no longer the entry point, and the local "0002"
     number is navra-side numbering (upstream RFC 0002 is
     agent-driven-policy-management) — any submission gets a
     maintainer-assigned number.

  2. Upstream has since merged RFC 0009 (supervisor middleware,
     2026-07): L7 traffic inspection that can inspect/deny/replace
     HTTP bodies and WebSocket text. Adjacent but not equivalent —
     middleware sees traffic content, the PIP is a
     supervisor-initiated query of in-sandbox application security
     state feeding OPA input as deny-only context. The draft must be
     repositioned against 0009 as complementary, or reviewers will
     ask why middleware is insufficient.

  Next step: refresh the draft (drop the number, reposition vs
  RFC 0009, note the issue-first process), then file the upstream
  feature-request issue. The 1-2d navra-side work starts only after
  upstream acceptance.

  Capability check (2026-10-30): OpenShell has NOT independently
  built the PIP capability — verified against the web docs AND the
  source at ~/Code/github.com/NVIDIA/OpenShell (clean clone at
  3a5dfcd2f, 2026-10-30). Source-level specifics: OPA input is
  built per-request from network/L7 context (NetworkInput {
  binary_path, host, port }; l7_request_policy_input; opa.rs),
  the supervisor's only dial-into-sandbox connection is the SSH
  relay Unix socket with peer-PID verification (supervisor_session.rs
  ~1192), and the "governance" code hits are gateway-interceptor
  config test fixtures plus examples/governance-interceptor —
  control-plane RPC interception, not egress. What shipped instead,
  and why none of it covers the gap:

  - Supervisor middleware (RFC 0009, shipped): content-driven — the
    supervisor calls operator-registered host-side gRPC services with
    request/response bodies for per-request allow/deny/transform. No
    query of in-sandbox application state, and middleware services
    run outside the sandbox.
  - OPA input: built per-request from request/L7 context
    (l7_request_policy_input); Rego data files are static/local. No
    runtime application-state injection path.
  - Sandbox service exposure (`service expose`, RFC 0017 draft):
    inbound ingress through the gateway relay — not a supervisor
    control-plane query, and RFC 0017 explicitly lists replacing
    egress policy as a non-goal.
  - OpenShell-Research "Egress Gate": external request evaluator the
    supervisor consults — closest in shape, but still content-driven
    and a research artifact, not the product.
  - Detection findings (OCSF) and dynamic policy updates are
    telemetry and control-plane revisions respectively, not policy
    inputs from inside the sandbox.

  Additional positioning insight for the draft refresh: the
  architecture docs state the trust principle "the sandbox ... never
  makes policy decisions." The strongest reviewer objection to the
  PIP is this principle, not middleware — the draft must lead with
  its existing mitigations (deny-only context, supervisor verifies
  the responder, PIP disconnect = baseline policy unchanged). The
  middleware issue threads show maintainers actively discussing
  "trusted guard service" shapes at the egress hook, so the audience
  is receptive.
description: |
  navra's IFC taint labels travel as MCP-level metadata. OpenShell's
  egress proxy cannot see them. A tainted response could be
  exfiltrated via a non-MCP channel that OpenShell allows.

  navra-side work (1-2 days once RFC is accepted):
  - Expose PolicyInformationPoint gRPC service on Unix socket
  - Stream taint context (data_classification, trust_state) from
    navra's TaintTracker to the supervisor
  - Supervisor injects into OPA input.pip for deny rules

  RFC draft: docs/openshell/rfc-0002-policy-information-point.md
acceptance:
  - navra exposes PIP gRPC service on /run/openshell/pip/navra.sock
  - Supervisor queries and injects taint into OPA input
  - Integration test: tainted data blocked at proxy
scope:
  - navra-server/src/ (PIP service)
  - docs/openshell/rfc-0002-policy-information-point.md
verification:
  quick: just test-server
