id: NAVRA-189
title: "Serve subscriptions/listen for 2026-07-28 peers"
status: done
priority: low
effort: 2-3d
description: |
  MCP 2026-07-28 replaced `resources/subscribe` with transport-neutral
  subscription streams (`subscriptions/listen`, SEP-2575-adjacent):
  the client opens one listen request with a notification filter, the
  server acknowledges, streams notifications, and the request
  lifecycle itself is the cancellation. rmcp 3.8 exposes this on the
  server side through two ServerHandler hooks:

  - `accepted_subscription_filter(&self, requested) -> Option<Filter>`
    (default: None = subscriptions/listen unimplemented)
  - `listen(&self, context: SubscriptionContext)` — run one
    established subscription until cancelled or closed

  navra today implements only the legacy surface: its own raw JSON-RPC
  dispatch handles `resources/subscribe` /
  `resources/unsubscribe` against the session-keyed
  resource_subscriptions map (navra-core/src/server/handlers.rs,
  handle_resource_subscribe) and advertises
  `subscribe: Some(true)` in ResourcesCapability.

  Work needed:
  - Implement the two ServerHandler hooks on NavraHandler, bridging
    rmcp's SubscriptionContext onto navra's existing subscription map
    and the SSE/broadcaster notification path (tools/list_changed
    forwarding from NAVRA-186 is the pattern to follow).
  - Decide the capability advertisement split: legacy
    `resources/subscribe` answers for pre-2026-07-28 peers,
    `subscriptions/listen` for 2026-07-28 peers. rmcp intersects the
    accepted filter with the requested filter and the advertised
    notification capabilities, so the two surfaces cannot drift
    independently.
  - Keep the existing legacy dispatch working — Claude Desktop and
    other current clients still use resources/subscribe.
notes: |
  - Implemented on branch mrtr-forwarding (worktree), same branch as
    NAVRA-188 (both are rmcp-3.8 follow-ups touching navra-core, so
    they were sequenced rather than parallelized).
  - Design: NavraHandler implements both hooks
    (navra-core/src/server/navra_handler.rs). The listen loop taps
    navra's existing internal notification bus — the SseBroadcaster
    (previously dangling in production: nothing subscribed to it
    outside tests). Each subscription registers under a synthetic
    session key ("subscription:{uuid}"): accepted resource URIs go
    into the resource_subscriptions map via the existing
    handle_resource_subscribe (which re-validates the URI), and the
    broadcaster channel under the same key receives both targeted
    resources/updated notifications (notify_session) and gateway-wide
    tools/list_changed broadcasts (notify). The loop selects between
    the request's cancellation token and the broadcast receiver,
    forwarding to the rmcp SubscriptionSink
    (notify_tool_list_changed / notify_resource_updated), and tears
    the registration down on every exit path.
  - Filter: accepted_subscription_filter passes through
    tools_list_changed (advertised true) and narrows
    resource_subscriptions to registered URIs (new
    McpServer::resource_exists accessor). Prompts/resources
    list_changed are never accepted — navra advertises them as false
    and never emits those notifications, so rmcp's capability
    intersection strips them anyway. Without a broadcaster
    configured, the method stays unimplemented (None →
    method_not_found).
  - Legacy surface untouched: raw-dispatch resources/subscribe (and
    the deprecated rmcp ServerHandler::subscribe, which navra never
    implemented) are unchanged; pre-2026-07-28 clients see the same
    behavior as before.
  - Tests: navra-core/tests/subscriptions.rs serves NavraHandler over
    duplex to a discover-lifecycle client (the only peer kind that
    can send the method) — tools_list_changed delivery, per-URI
    resource update delivery, and filter narrowing (unknown URIs
    dropped, unsupported categories stripped from the acknowledged
    filter).
  - Wire-shape notes from the implementation: notify_resource_updated
    has no production trigger yet (nothing calls it outside tests) —
    wiring upstream resource-update notifications into it is a
    natural follow-up when an upstream needs it. Docs updated in
    docs/content/docs/learn/json-rpc.md (subscriptions/listen
    paragraph in the notifications section).
