id: NAVRA-194
title: "Multi-replica navra gateway"
status: completed
priority: high
effort: 2-3w
tags: [kubernetes, scaling, state]
description: |
  The gateway deployment (deploy/k8s/) is single-replica by design:
  TeamRegistry is in-memory and sessions/audit/knowledge are SQLite
  on the StatefulSet's PVC (NAVRA-193). Scale-out requires
  externalizing the state that currently pins the gateway to one
  pod:

  1. **TeamRegistry** (teams, teammates, blackboard, task handles)
     — in-memory behind Mutex. Needs a shared store (Redis or a
     SQLite-over-shared-FS with leader election) or a
     shard-by-team routing layer (a Service per gateway replica is
     not viable for team affinity; consider a control/data split:
     one coordinator replica owns teams, workers serve MCP/model
     proxy statelessly).
  2. **Sessions** (navra-memory SessionStore, SQLite) — session
     taint labels feed IFC model routing (NAVRA-192); multi-replica
     means label joins must see all sessions. Externalize to the
     shared store, or accept per-replica taint scoping with
     sticky sessions.
  3. **Audit blackbox / knowledge store** (SQLite, append-heavy) —
     move to the shared store or partition per replica with a
     merge view.
  4. **Capability tokens** — delegated tokens verify against the
     root signer's public key; already replica-safe (stateless
     verification) apart from the nonce cache (replay protection),
     which must be shared or relaxed to per-replica.

  Also: kubectl-based Sandbox spawning from every replica needs
  RBAC per replica SA (fine, namespaced) and result collection
  must reach the replica that spawned the teammate (the in-memory
  JoinHandle is per-replica — route results via the shared
  blackboard instead of task handles).

  Acceptance:
  - Two gateway replicas behind one Service, both serving MCP and
    /v1 with delegated-token auth
  - A team created on replica A gets its teammate result collected
    on replica B (blackboard-routed)
  - Session taint / IFC model routing behaves correctly with
    sticky-off clients (or documented sticky requirement)
notes:
  - "Prerequisite design decision: shared store (Redis) vs
    coordinator/worker split. The split avoids new infrastructure
    but serializes team operations; Redis is the general answer.
    Prototype the split first — teams are low-churn."
  - The e2e driver (examples/kubernetes/e2e-driver.py) is the
    validation harness; extend it for the two-replica scenario.
  - "COMPLETED (2026-11-16, lab SNO) via the coordinator/worker
    split, no new infrastructure": cluster_role config with auto
    StatefulSet-ordinal detection (pod 0 coordinates, higher
    ordinals work). Workers forward coordinator-owned tool calls
    (team_*/flow_*/agent_signal) and the /api/agent/task|result
    endpoints to the coordinator VERBATIM — same method, path,
    headers, body — so the coordinator applies its full
    auth/ACL/IFC/safety pipeline to the caller's original identity
    (verified: forwarded team_status/team_result executed on the
    coordinator as agent=lead). Delegated tokens verify on any
    replica via a shared root identity (Secret-mounted seed,
    [server.identity] key_path). Worker /v1 proxies query the
    coordinator's /api/internal/agent-label for the cross-replica
    IFC taint join (falls back to the local view on failure).
    Workers skip triggers and the warm-pool startup ensure.
    Acceptance verified: two replicas behind one Service both
    serving MCP and /v1 (worker /v1 exercised directly); team
    created on replica A, teammate spawned from the warm pool,
    result collected via replica B; sticky-session requirement
    documented in deploy/k8s/README.md. e2e-driver --second-endpoint
    drives the scenario. Known limits / future work: per-replica
    worker state (sessions/memory/audit) is local scratch — the
    authoritative taint join covers model routing, not full session
    externalization (Redis when needed); token revocation lists do
    not propagate (coordinator-owned revocation or shared store
    later); worker PVCs hold scratch data (Deployment+emptyDir
    refactor would avoid the storage cost); OVN-compatible sandbox
    network isolation still open (see NAVRA-195 notes).
