id: NAVRA-187
title: "Upgrade rmcp 1.8 to 3.x"
status: done
priority: medium
effort: 3-5d
description: |
  navra pins rmcp 1.8.0 (2026-06-23); the SDK has since shipped 2.x
  and the full 3.x line (3.8.0, 2026-10-26) implementing the complete
  MCP 2026-07-28 specification. Official migration guide:
  https://github.com/modelcontextprotocol/rust-sdk/discussions/969

  Motivation beyond spec completeness — several 3.x fixes land on
  issues hit during the 2026-10 security-wiring pass:
  - 3.6.0 #1344: cancel abandoned tools/call / prompts/get /
    resources/read (complements our request timeouts, which currently
    just drop the abandoned future)
  - 3.6.0 #1049: bound the incoming line buffer in AsyncRwTransport
    (transport-level DoS bound complementing the discovery bounds)
  - 3.6.0 #1333: cancel pending request tokens after transport EOF
    (the fix class for the hang-on-undecodable-response defect noted
    in NAVRA-186)
  - 3.8.0 #1363: stop SSE reconnects on permanent GET errors

  Breaking changes that hit navra directly (see the guide's TL;DR):
  - ServerHandler::{call_tool, get_prompt, read_resource} return
    types widen (CallToolResult -> CallToolResponse etc.) —
    navra-core/src/server/navra_handler.rs implements these manually
  - ServerResult gains InputRequiredResult; protocol unions become
    #[non_exhaustive] — wildcard match arms
  - Meta splits into MetaObject/RequestMetaObject/NotificationMetaObject;
    *RequestParam -> *RequestParams renames — ripples through the
    navra-protocol compat layer
  - StreamableHttpService requires S: ServerHandler;
    stateful_mode -> legacy_session_mode; resources/subscribe ->
    subscriptions/listen for 2026-07-28 peers
  - Client surface is kinder: serve() unchanged (the
    UpstreamNotificationHandler ClientHandler impl should mostly
    survive); call_tool gains automatic MRTR driving (*_once to opt
    out)

  MSRV 1.88 — compatible with the workspace's 1.98.

  First step: run the NAVRA_TEST_SCHEMA_DEPTH=100 repro against 3.8
  to settle whether the undecodable-response hang is fixed upstream
  (the security-wiring timeouts remain correct defense in depth
  either way).
notes: |
  - Implemented on branch rmcp-3-upgrade (worktree), based on
    security-wiring-gaps but kept a separate branch per the
    "do not fold into the security-wiring branch" rule.
  - Upgrade landed as rmcp/rmcp-macros 1.8.0 -> 3.8.0 (+process-wrap
    10.x); the workspace pin is the only version reference.
  - NAVRA_TEST_SCHEMA_DEPTH=100 repro result: the hang is NOT fixed
    upstream. rmcp 3.8's transport deliberately ignores unparsable
    input (upstream #938, matching the other official SDKs), so a
    response nested past serde_json's 128-level recursion limit is
    dropped and the pending request never resolves while the server
    process lives; #1333 only cancels tokens after transport EOF.
    The security-wiring request timeouts remain load-bearing —
    pinned by the new upstream_undecodable_response_fails_closed_
    within_timeout regression test in navra-core/tests/
    upstream_integration.rs.
  - #1344's abandoned-request cancellation now complements the
    timeouts: dropping the timeout future sends
    notifications/cancelled to the upstream instead of silently
    abandoning it.
  - Protocol negotiation changed per SEP-2567: initialize only
    exists for pre-2026-07-28 versions. A client naming 2026-07-28
    over legacy initialize is answered with 2025-11-25 (newest
    handshake version); 2026-07-28 clients use server/discover,
    which rmcp 3.8 serves statelessly by default. The e2e
    mcp_initialize_returns_capabilities test asserts both paths.
  - MRTR (SEP-2322) forwarding: upstream forwarding keeps single-round
    semantics — rmcp 3.8's macro-generated Peer::{call_tool,
    get_prompt, read_resource} return the final result and error on
    input_required/task responses. Transparent InputRequired
    pass-through (and the ACL/IFC questions it raises) is tracked as
    NAVRA-188; serving subscriptions/listen for 2026-07-28 peers is
    tracked as NAVRA-189.
  - navra-protocol compat layer absorbed the content-model
    flattening: Content = ContentBlock, the Raw* names alias the flat
    types (RawContent = ContentBlock, RawResource = Resource, ...),
    PromptRole = Role, RequestMeta = MetaObject; Annotated is gone
    (content/resource types carry meta inline). Downstream churn was
    mostly mechanical (.raw accessors removed, Content{raw:
    RawContent::Text(t)} patterns -> Content::Text(t),
    #[non_exhaustive] literals switched to constructors).
  - SEP-2577 deprecates protocol-level logging; navra keeps
    answering logging/setLevel for older clients, with
    #[allow(deprecated)] at the compat re-exports.
  - The security-wiring branch's integration tests (scanner,
    manifest, bounds, list_changed, timeouts) plus the full workspace
    suite passed against 3.8.0 (2915 workspace tests; navra-server
    e2e 12/12, unit 356/356). Pre-existing environmental failures
    unchanged from base: 4 adversarial_eval tests (3 need the
    localhost/mcp-filesystem and mcp-git podman images; 1 sends
    model "test" that no config maps).
  - Machine note: alsa-lib-devel is not installed; navra-modal-voice
    (cpal) was built against locally extracted Fedora alsa-lib-devel
    RPMs under /tmp/opencode/alsa-prefix with PKG_CONFIG_PATH.
