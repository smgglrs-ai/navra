id: NAVRA-188
title: "Forward upstream MRTR input_required responses through the gateway"
status: done
priority: medium
effort: 2-4d
description: |
  Since NAVRA-187 (rmcp 3.8), navra's upstream forwarding keeps
  single-round semantics: rmcp's macro-generated
  Peer::{call_tool, get_prompt, read_resource} return the final
  result and fail with an "unexpected response" ServiceError when an
  upstream answers with a SEP-2322 `input_required` (multi
  round-trip request) intermediate result. The agent sees a generic
  upstream error instead of the input request.

  The 3.x API now makes pass-through structurally possible:
  - Client side: Peer::call_tool_once / get_prompt_once /
    read_resource_once return the CallToolResponse / GetPromptResponse
    / ReadResourceResponse unions (Complete | InputRequired | Task).
  - Server side: NavraHandler::call_tool already returns
    CallToolResponse, so an InputRequiredResult can be forwarded to
    navra's client, whose input_responses would flow back on the next
    tools/call round (CallToolRequestParams carries them).

  Security design questions that must be answered before enabling
  pass-through (the reason it was out of scope for the upgrade):
  - The InputRequiredResult's input_requests carry upstream-controlled
    request descriptions (elicitation/sampling/roots prompts) — the
    same injection surface tool descriptions get. Decide whether the
    safety-hook/IFC pipeline must inspect them before they reach
    navra's clients.
  - Each follow-up round (input_responses in hand) must re-enter the
    full permission/IFC pipeline, not inherit the first round's
    grant — the responses are agent-controlled content flowing to the
    upstream.
  - The Task variant (SEP-2663 tasks extension) must NOT be
    forwarded: navra does not declare the tasks capability and does
    not forward tasks/get polling. Keep failing it closed with a
    clear error.

  Alternative to pass-through, if the security review lands against
    it: keep single-round semantics but replace the generic ServiceError
    with a navra-shaped CallToolResult::error explaining that the
    upstream requires interactive input navra does not forward.
notes: |
  - Implemented on branch mrtr-forwarding (worktree), based on main
    after the NAVRA-187 merge. Scope: tools/call only — prompts/get
    and resources/read forwarding remain single-round (upstream
    prompt/resource MRTR is unobserved in the wild; note for a future
    item if it matters).
  - Security answers, as implemented:
    (1) input_requests text IS filtered — elicitation messages,
    sampling system prompts, and sampling message texts are extracted
    into a synthetic result, run through the same post-call pipeline
    (hooks, or the permission set's legacy filter), and written back
    positionally; a pipeline block fails the round closed with a
    tool-level error (navra-core/src/server/handlers.rs
    filter_input_required). The intermediate round also carries the
    external-read IFC label into the session taint and is recorded in
    the blackbox with outcome "input_required".
    (2) per-round re-entry is structural: a follow-up round is a new
    tools/call whose input_responses/request_state are carried on
    CallContext (navra-auth CallContext.mrtr_*) and forwarded
    verbatim; all gates re-run because the round enters
    handle_call_tool like any call.
    (3) Task results fail closed inside the forwarding closure with
    an error naming SEP-2663.
  - Compatibility: SEP-2322 input_required only exists on the wire
    from 2026-07-28. NavraHandler::call_tool gates on the negotiated
    version (peer_info for initialize/HTTP-stateless peers, per-
    request _meta for discover-based duplex peers) and downgrades to
    a tool-level error for legacy peers, so navra's own agent stack
    (which serves () as ClientHandler and single-round Peer::call_tool)
    keeps receiving error results instead of protocol errors.
  - Type ripple: navra-mcp ToolHandler now returns CallToolResponse
    (From<CallToolResult> widens local tools; the #[tool] macro wraps
    into Complete; builder inline tools go through a widen()
    combinator); McpServerBuilder::tool is generic over
    T: Into<CallToolResponse>. Flattening dispatchers (ACP, A2A,
    flows, plan execution) use navra_core::flatten_tool_response —
    input_required becomes a tool-level error naming the requirement.
    navra-protocol compat adds CallToolResponseExt::expect_complete
    for tests/helpers.
  - Tests: navra-core/tests/upstream_integration.rs gains
    upstream_input_required_forwards_with_redacted_request_text,
    upstream_input_required_round_trip_completes,
    upstream_task_result_fails_closed,
    navra_handler_downgrades_input_required_for_legacy_peers, and
    navra_handler_forwards_input_required_to_2026_peers (discover-
    lifecycle client over duplex). test_upstream.py gains
    NAVRA_TEST_INPUT_REQUIRED and NAVRA_TEST_TASK_RESULT modes.
    Wire-shape notes for future test-server work: elicitation params
    use the flat legacy form (message + requestedSchema at the params
    top level — the tagged "mode" form also works but the nested
    {"form": {...}} shape does NOT), and task statuses are
    working/input_required/completed/failed/cancelled.
  - Verified: 2921 workspace tests, navra-server e2e 12/12, unit
    356/356, clippy -D warnings clean. The 3 adversarial_eval
    failures are the pre-existing podman-image environmental ones.
    Docs updated in docs/content/docs/learn/upstream-and-proxy.md.
