id: NAVRA-193
title: "Migrate Kubernetes agent spawning to AgentSandbox v1beta1"
status: done
priority: high
effort: 1d
tags: [kubernetes, agent-sandbox, upstream]
description: |
  navra's Kubernetes spawn path targeted agents.x-k8s.io/v1alpha1 —
  an API version that no longer exists. The kubernetes-sigs/
  agent-sandbox controller removed v1alpha1 in v1.0.0 (no
  conversion webhooks); current releases serve v1beta1 only. The
  old spec shape (spec.templateRef / spec.image / spec.env /
  spec.resources) does not exist in v1beta1.

  Migrated (navra-server/src/agent_spawn.rs):
  - manifest: agents.x-k8s.io/v1beta1 Sandbox with a full inline
    PodSpec (spec.podTemplate.spec.containers[0]) — the
    SandboxTemplate indirection is an extensions-group concept a
    direct Sandbox does not need, so KubernetesAgentConfig.template
    and the kubernetes_agent_template config field are removed
  - secure defaults: restartPolicy Never (teammates run to
    completion), automountServiceAccountToken false (the agent
    authenticates with a delegated navra capability token, not the
    namespace ServiceAccount)
  - completion detection: .status.phase (nonexistent in v1beta1) →
    the Finished condition
  - log collection: logs pod/<sandbox-name> -c agent (the v1beta1
    controller names the backing Pod after the Sandbox)
  - memory quantities: navra's Podman-style container_memory values
    (2g, 512m) are invalid Kubernetes quantities — normalized at the
    manifest boundary (g→Gi, m→Mi, ...), config value unchanged for
    the Podman path
notes: |
  - Validated empirically against the lab SNO (OpenShift 4.22,
    K8s 1.35.6) with agent-sandbox v1.0.11 installed (core-only
    sandbox.yaml, agent-sandbox-system namespace): server-side
    dry-run of the new manifest passes; a live busybox Sandbox
    confirmed Ready wait, Pod-named-after-Sandbox logs, and the
    Finished condition. The dry-run is what caught the memory
    quantity bug.
  - The operator install on lab: kubectl apply of the pinned
    v1.0.11 sandbox.yaml. CRD serves v1beta1 only.
  - The v1alpha1 path was never usable against a real cluster with
    current operator releases, so removing kubernetes_agent_template
    breaks no working deployment.
  - Tests: manifest structure (v1beta1 shape, no templateRef,
    restartPolicy/automount defaults, inline env), custom config,
    memory normalization (podman→k8s mapping + passthrough), plus
    the pre-existing name-sanitization and kubectl-base tests.
  - E2E COMPLETE (2026-11-15, lab SNO): the full in-cluster
    loop passes — team_message through the gateway → v1beta1
    Sandbox spawn (imagePullPolicy Always for the mutable agent
    tag) → Ready wait → distroless navra-agent Pod connects back to
    navra-gateway.navra.svc:9315 with its delegated capability
    token → model calls through the gateway /v1 proxy → in-cluster
    ollama StatefulSet (qwen2.5:0.5b) → Finished condition → logs,
    metrics (iterations/tokens), sandbox cleanup → result via
    team_result. Two more production bugs found and fixed on the
    way (commit 3392607b): the registry refused base_url-only model
    entries while the /v1 proxy resolves by base_url ('no model
    configured'), and the CapabilityAuthenticator was gated on
    has_cap_agents so token-hash-only deployments 401'd every
    teammate call. The teammate agent also now authenticates its
    model calls with NAVRA_TOKEN (commit d00fabb8) — previously it
    sent no credentials, fine for llama.cpp but fatal against the
    gateway's /v1.
  - navra-server CI image — root cause found after a misdiagnosis
    chain (2026-11-15): the image built and pushed successfully on
    EVERY 'failed' run; the failing step was always the Trivy CVE
    gate (annotations report only 'exit code 1', and the first
    failure's truncated message pointed at the cargo step). The
    CARGO_JOBS / thin-LTO / runner-disk mitigations were built on
    that misread — unnecessary but harmless hardening that stays.
    Actual failures: (1) kubectl v1.35.6 CRITICAL Go-stdlib CVEs →
    bumped to v1.35.10; (2) three remaining HIGH DoS-class CVEs in
    x/net/x/text bundled by every kubectl release through v1.37.2
    (checked go.mod per tag) → scoped .trivyignore with documented
    removal conditions. Lesson recorded: read the actual logs
    before theorizing about runner resources.
  - Deployment notes for the record: images pushed to the SNO
    internal registry (default route; SNI routing means podman
    pushes must run ON lab — ClusterIPs are not node-routable
    under OVN-K); ollama runs as a StatefulSet in the navra
    namespace (HOME/.ollama on the PVC, self-pull at startup — the
    image has no curl); 192.0.2.10 is the API VIP (HAProxy,
    only cluster service ports), not a general node address.
  - CI first-run fixes (2026-11-15, commits 4f238b91..6fd00bd4):
    setup-oras v5 does not exist (current major: v2); oras layer
    titles come from the path given at push, so the round-trip
    diff needs the bare filename (push from inside the bundle
    directory); the navra-server musl build OOMs the CI runner at
    full-core parallelism (CARGO_JOBS=2 now passed via
    build-args). After the fixes, agent-bundles is green: the three
    bundles are published as signed OCI artifacts with verified
    round-trips. Packages are created PRIVATE by the registry
    default — flip to public in GitHub package settings (one-time,
    per package): ghcr.io/smgglrs-ai/{researcher,code-reviewer,
    security-auditor} plus navra-server when its build lands.
  - Gateway image build (2026-11-15): three musl-build failures
    found and fixed locally that CI would have hit only after push —
    protoc (gRPC modules), cpal/alsa-sys (made optional: 'voice'
    feature, default on for desktop, off in the container), and
    sqlite-vec (BSD u_intN_t typedefs missing on musl — worked
    around with CFLAGS -Du_intN_t=uintN_t; typedef redeclaration to
    the same type is valid C11). The sqlite-vec musl bug is
    upstream (present in 0.1.9); worth filing an issue on
    asg017/sqlite-vec.
