id: NAVRA-190
title: "Within-session cost routing in the model-server inference gateway"
status: done
priority: medium
effort: 1-2d
description: |
  The model server's OpenAI-compatible /v1/chat/completions endpoint
  served whatever model the client named — no within-session cost
  routing. navra already had the surrounding pieces (team_spawn model
  selection at spawn time via ModelCard scoring, a RoutingHook that
  classifies tool calls by tier), but nothing re-routed a single
  agent session mid-conversation, and the RoutingHook's injected
  `_routing_model` metadata has no consumer.

  Implemented (navra-model-server):
  - New `router` module: SessionRouter with per-session state (keyed
    by hash of requested model + first message content, stable across
    OpenAI-style stateless requests that resend full history).
  - Complexity signal: reasoning keywords in the trailing message
    window or tools present in the request keep the frontier model;
    simple turns downgrade after `min_messages` of history (early
    turns rarely reveal task difficulty).
  - Compaction signal: tracked conversation size drop of ≥25% marks a
    compaction boundary; rules with `switch_only_at_compaction`
    defer downgrades there (mirrors remote-provider prompt-cache
    economics — the cache busts at compaction anyway). Upgrades on
    complexity are never deferred.
  - api.rs wiring: routing decision before registry lookup; response
    `model` field rewritten to the requested name (client
    transparency); actual backend exposed via `x-navra-routed-model`
    response header and tracing.
  - Config: `[model_routing]` in navra-server config (plumbed to
    ModelServerConfig.routing, used by `navra model serve`), full
    schema regen.
  - Drive-by fix: chat_completions previously deserialized
    CreateResponseRequest from `rest` without the `model` field
    (captured by the named struct field, so always missing) — every
    request 400'd. Now re-injects the routed model name.
  - ModelRegistry::insert for registering pre-built backends
    (embedded mode, tests).
notes: |
  - Follow-up (second commit): the gateway's /v1 model proxy
    (navra-server ui.rs) now applies the same SessionRouter — this is
    the path teammates' sandboxed traffic takes (agent_spawn points
    them at the gateway /v1 for safety/IFC/audit). Routed requests
    resolve the cheap model's [models.*] entry for upstream
    URL/credentials and rewrite the upstream body's model name;
    response model field and x-navra-routed-model header mirror the
    model-server behavior; blackbox audit records
    model=<requested> routed=<actual>. Non-routed entry resolution
    now falls back to the requested model's entry when the caller
    has no configured model (previously always the Ollama default).
    Streaming responses carry the header; SSE chunk contents still
    name the actual model (known limitation).
  - The RoutingHook (`[routing]`, tool-tier classification) remains
    consumer-less; either retire it or wire `_routing_model` into
    this router as an explicit hint (the router already supports
    passthrough semantics that would fit).
  - IFC-driven mid-session downgrade (third commit): implemented as
    [model_ifc] in the gateway /v1 proxy. The inbound safety scan now
    uses process_inbound_with_findings (new navra-safety API); any
    finding marks the conversation sensitive, forcing the request
    onto the configured local model (locality != "remote") —
    overriding cost routing and compaction deferral. History resend
    makes the override naturally sticky per session.
    deny_without_local = true fails closed (safety_error) when no
    local model is available; default logs and proceeds. Detection
    scans user/system messages only — assistant messages quoting
    tainted tool output are not scanned (session-taint state is not
    reachable from the proxy; the content-based scan is the practical
    approximation). Detection strength is bounded by the caller's
    safety pipeline.
  - Tests: 12 router unit tests + 4 model-server handler tests
    (first commit); 3 gateway proxy handler tests against an
    in-process mock upstream + the pre-existing Ollama format test
    switched from qwen3:8b (5.5 GiB, OOM-fragile) to the documented
    qwen2.5:0.5b test prerequisite (second commit); 3 IFC handler
    tests — sensitive conversation forced to local model, clean
    conversation passthrough, deny-without-local fail-closed — plus a
    navra-safety test for process_inbound_with_findings (third
    commit). All pass single-threaded (--test-threads=1, per justfile
    convention).
