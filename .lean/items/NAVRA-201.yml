id: NAVRA-201
title: "SPIRE workload identity via Red Hat ZTWIM for gateway mTLS"
status: completed
priority: medium
effort: 5-8d
tags: [security, spiffe, spire, mtls, kubernetes]
depends_on: ["NAVRA-199"]
source: user direction 2026-11-17 — the NAVRA-199 phase-3 trigger fired
relates: |
  NAVRA-199 documented the SPIRE trigger conditions and the
  SA-token/attestation wrinkle; this item executes phase 3 with the
  Red Hat Zero Trust Workload Identity Manager (ZTWIM) operator
  (GA 1.1, standard OCP entitlement, channel stable-v1). navra
  already federates SPIFFE IDs at the app layer (WIMSE: spiffe:// →
  did:web, JWT-SVID acceptance) — this adds the transport layer.
description: |
  Replace the chart-internal CA (NAVRA-199 phases 1-2) with
  cluster-attested SPIFFE identities for the gateway deployment:

  1. ZTWIM operator + operands on the cluster (SpireServer,
     SpireAgent, SpiffeCSIDriver, trust domain, bundle ConfigMap).
  2. Workload registration for the gateway StatefulSet pods with
     DNS names in the SVID (service + headless + per-pod DNS) so
     standard clients (reqwest, curl) can verify hostname while
     SPIFFE-aware verification uses the URI SAN.
  3. SVID consumption: SPIFFE Helper (ZTWIM 1.1) writes the
     X509-SVID cert/key to a shared volume and signals on rotation
     — navra must HOT-RELOAD its TLS acceptor (SVID TTLs are short;
     the current acceptor is built once at startup). The agent
     binary stays file/env based (distr.less scratch cannot use the
     Workload API; agents authenticate with delegated tokens and
     only need the SPIRE bundle as NAVRA_TLS_CA_FILE trust).
  4. Worker→coordinator mTLS with SVIDs: worker presents its SVID,
     coordinator verifies against the SPIRE bundle
     (tls_client_ca_path → bundle from the ConfigMap).
  5. Helm: tls.source = "spire" option mounting the bundle
     ConfigMap + SPIFFE Helper sidecar.

  Known design points:
  - X509-SVIDs use URI SANs; hostname verification for normal
    clients requires dnsNames on the SPIRE entry.
  - The SA-token wrinkle from NAVRA-199 was about SPIRE's classic
    in-pod psat attestation; ZTWIM's agent runs at node level with
    its own identity and attests workloads via pod selectors —
    sandbox pods with automountServiceAccountToken: false are not
    blockers for the GATEWAY path (agents are not being SVID'd in
    v1).

acceptance:
  - Gateway serves TLS with an SVID issued by ZTWIM (verified via
    the bundle from the ConfigMap)
  - Cert rotation hot-reloads without pod restart
  - Worker→coordinator mTLS presents SVIDs; full two-replica e2e
    passes with tls.source = spire
  - Chart-internal CA remains available (tls.enabled) for clusters
    without ZTWIM
scope:
  - navra-server/src/tls.rs (acceptor hot-reload)
  - deploy/helm/navra/ (spire option, helper sidecar)
verification:
  quick: cargo test -p navra-server --bin navra tls; SNO e2e
notes:
  - "COMPLETED (2026-11-17, lab SNO)": ZTWIM 1.1.3 (channel
    stable-v1) + operands deployed; SVID issuance verified for
    registered pods; full two-replica chart e2e over SPIRE-backed
    mTLS (tls.source=spire): both replicas serve HTTPS from
    helper-written SVIDs (openssl verify against the spire-bundle
    ConfigMap passes), workers present SVIDs to the coordinator,
    agents trust the helper-written bundle, teammate warm-claimed +
    task/model/result flow all over TLS. ZTWIM stays installed as
    cluster infrastructure; the kubelet-DNS Service (name "sno" in
    the ZTWIM namespace with manual Endpoints) is REQUIRED for
    workload attestation and must be recreated if lost.
  - ZTWIM/SPIRE operational findings: (1) the CRD group is
    spire.spiffe.io (NOT spiffe.spiffe.io — an easy trap; the
    spire-controller-manager templates use .PodMeta/.PodSpec, not
    the flattened names of older versions); (2) ClusterSPIFFEIDs
    need className = zero-trust-workload-identity-manager-spire;
    (3) pods race the entry update by ~2s — one-shot SVID fetches
    fail on first try, long-running workloads (incl. the SPIFFE
    Helper) retry and converge; (4) the controller-manager's CRD
    cache can go stale after CRD churn — restarting spire-server-0
    fixes it; (5) ghcr.io/spiffe/spiffe-helper image tags have no
    v prefix and v0.12.3 is unpublished — 0.12.1 is current.
  - navra findings: the Helm sidecar insertion initially orphaned
    the gateway container's volumeMounts onto the helper (silent
    default-config fallback — the symptom was "No agents
    configured" with a valid configmap; caught by comparing the
    deprecation-warning line against a same-image debug pod).
    Chart hot-reload design validated by unit test
    (tls_acceptor_hot_reloads_on_cert_change) and live SVID TTLs
    (1h).
