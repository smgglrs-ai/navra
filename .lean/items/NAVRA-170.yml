id: NAVRA-170
title: "SelfCompact rubric as flow-driven compression policy"
status: done
priority: high
effort: 3-5d
depends_on: []
feeds: ["NAVRA-092"]
source: tech-watch-2026-07-01
description: |
  Implemented the SelfCompact 4-condition compression rubric as a
  gateway-enforced policy. Compression timing is governed by flow
  execution state rather than a fixed token threshold.

  Components:
  - FlowPhase enum: NodeBoundary, ActiveDerivation, NodeCompleted,
    TrajectoryConvergence, Stuck
  - CompressionPolicy: pure function of (phase, budget, tokens)
  - Flow engine updates phase at node boundaries
  - Tool loop consults policy before compacting
  - Loop detector sets TrajectoryConvergence on repeated patterns
  - Config field: budget.compression_policy = true

  Reference: arxiv.org/abs/2606.23525 (SelfCompact, June 2026)
acceptance:
  - Compression rubric fires on flow DAG node completion
  - Compression suppressed during active derivation
  - Compression suppressed during stuck state
  - Compression fires on trajectory convergence
  - Policy configurable per-agent via budget.compression_policy
  - Legacy token-based compaction preserved when policy disabled
  - 8 new policy tests, no regressions across 400+ tests
