id: NAVRA-185
title: "Replace TOML config with JSON for UI write operations"
status: done
priority: medium
effort: 10-15d
tags: [config, ui, architecture]
progress: |
  Implemented JSON config format as replacement for TOML:
  - Step 1: Added Serialize derive to all config structs (14 files, 3 crates)
  - Step 2: Dual-format Config::load() supports .json and .toml, TOML deprecated
  - Step 4: Mutation API endpoints (PUT/DELETE for permissions + agents,
    POST /api/config/reload) with atomic JSON write-back
  - Step 5: PermissionsPage and AgentsPage wired with edit/delete forms
  - Step 7: `navra config export` CLI command for TOML→JSON migration
description: |
  Replace TOML config with JSON for UI-driven config mutations.
  JSON is natively serializable without formatting loss, following
  the pattern of Claude Code (settings.json) and OpenCode.

  Both formats supported during transition: Config::load() detects
  by extension (.json preferred, .toml deprecated with warning).
  Config::save() writes pretty-printed JSON with atomic rename.

  Mutation endpoints write directly to config.json via
  Arc<RwLock<Config>>.
acceptance:
  - Permission sets can be created/edited/deleted from the web UI
  - Agent definitions can be modified from the web UI
  - Changes persist across restarts via config.json
  - Existing TOML configs work with deprecation warning
  - `navra config export` converts TOML to JSON
