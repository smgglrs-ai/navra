id: NAVRA-185
title: "Migrate config persistence from TOML to SQLite for UI write operations"
status: backlog
priority: medium
effort: 10-15d
tags: [config, ui, architecture]
description: |
  The navra-ui web console is currently read-only because config
  mutations (editing permissions, agents, safety rules) require
  writing back to config.toml, which risks clobbering comments
  and hand-edited formatting.

  Use this as the forcing function to migrate config persistence
  from TOML files to SQLite (or structured JSON), enabling:
  - UI-driven CRUD for permission sets, agent definitions,
    safety rules, and model configurations
  - Hot-reload without restart
  - Config versioning and rollback
  - Audit trail for config changes

  TOML files remain as the initial seed format (import on first
  run), but runtime state lives in the database.

  Scope:
  - Design config schema in SQLite
  - Implement config read/write layer with migration from TOML
  - Add mutation API endpoints (POST/PUT/DELETE for permissions,
    agents, safety, models)
  - Wire navra-ui pages to use mutation endpoints
  - Add config change audit logging
acceptance:
  - Permission sets can be created/edited/deleted from the web UI
  - Agent definitions can be modified from the web UI
  - Changes persist across restarts
  - Existing TOML configs are imported on first run
