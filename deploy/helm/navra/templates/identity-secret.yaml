# Root identity seed for delegated capability tokens. Shared by all
# replicas of this deployment (mounted read-only at /identity);
# scoped to this release so tokens do not verify across deployments.
#
# The seed is generated once and PRESERVED across upgrades (lookup
# the existing Secret first) — regenerating it on every upgrade
# would rotate the root identity and invalidate every delegated
# token issued by this deployment.
{{- if .Values.identity.create }}
{{- $secretName := printf "%s-identity" (include "navra.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $seed := randAlphaNum 32 }}
{{- /* The key is literally "identity.key" — index, not attribute
       access ($existing.data.identity.key would look for a nested
       .identity map). */}}
{{- if $existing }}
  {{- with index $existing.data "identity.key" }}
    {{- $seed = . | b64dec }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Any 32 bytes work as an Ed25519 seed.
  identity.key: {{ $seed | quote }}
{{- end }}
