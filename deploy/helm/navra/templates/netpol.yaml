# Egress isolation for agent Sandbox pods (NAVRA-196).
{{- if .Values.netpol.dnsNamespace }}
#
# Selects every pod the gateway spawns (warm-pool Sandboxes and
# cold-created Sandboxes both carry app.kubernetes.io/managed-by:
# navra) and restricts egress to exactly:
#   - this release's gateway pods, TCP {{ include "navra.gatewayPort" . }} (MCP + /v1 + the agent
#     task/result API)
#   - cluster DNS
#
# The DNS rule is scoped with a podSelector to the DNS daemon pods
# (netpol.dnsPodLabel, a key=value scalar chosen over a matchLabels
# map because Helm deep-merges maps — an OpenShift override would
# silently keep the default k8s-app: kube-dns key and select
# nothing) instead of every pod in the DNS namespace — without it
# the rule allows egress to ANY port on ANY pod there.
#
# PORTS WORKAROUND (netpol.dnsRestrictPorts, default false): under
# OVN-Kubernetes, port-restricted egress rules never match the
# DNS punt path, so `ports: [53]` silently drops all DNS
# regardless of the destination allow (verified by bisection on
# OpenShift 4.22: any egress rule WITH a ports restriction breaks
# DNS; destination-based allows without ports work). The DNS
# namespace is a value because it differs per platform
# (openshift-dns on OpenShift, kube-system on vanilla Kubernetes).
#
# Ingress is intentionally unrestricted: sandbox pods run as
# clients only (no listener), and denying ingress would also break
# kubelet readiness probing from the node.
{{- /* Validate dnsPodLabel at RENDER time: a malformed value would
       otherwise render a NetworkPolicy whose DNS rule silently
       selects nothing (or fails validation only at apply time, far
       from the operator's values change). Go template variables are
       block-scoped, so the parsed key/value are declared here and
       assigned inside the guard for the podSelector below. */}}
{{- $dnsLabelKey := "" }}
{{- $dnsLabelValue := "" }}
{{- if .Values.netpol.dnsPodLabel }}
{{- $kv := splitList "=" .Values.netpol.dnsPodLabel }}
{{- if ne (len $kv) 2 }}
{{- fail (printf "netpol.dnsPodLabel must be exactly one key=value pair (got %q). Set it to \"\" to select the whole DNS namespace." .Values.netpol.dnsPodLabel) }}
{{- end }}
{{- $dnsLabelKey = index $kv 0 }}
{{- $dnsLabelValue = index $kv 1 }}
{{- if not $dnsLabelKey }}
{{- fail (printf "netpol.dnsPodLabel has an empty key (got %q)" .Values.netpol.dnsPodLabel) }}
{{- end }}
{{- if not $dnsLabelValue }}
{{- fail (printf "netpol.dnsPodLabel has an empty value (got %q); a key with an empty value selects almost nothing — set the whole value to \"\" to select the entire DNS namespace instead" .Values.netpol.dnsPodLabel) }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $dnsLabelValue) }}
{{- fail (printf "netpol.dnsPodLabel value %q is not a valid Kubernetes label value (allowed: alphanumerics, '-', '_', '.')" $dnsLabelValue) }}
{{- end }}
{{- /* Key: optional DNS-subdomain prefix (dot-separated DNS labels,
        no underscores) + '/', then the name part (alphanumerics,
        '-', '_', '.'). */}}
{{- if not (regexMatch "^(([A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?\\.)+[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$" $dnsLabelKey) }}
{{- fail (printf "netpol.dnsPodLabel key %q is not a valid Kubernetes label key (optional DNS prefix like dns.operator.openshift.io/, then alphanumerics, '-', '_', '.')" $dnsLabelKey) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "navra.fullname" . }}-sandbox-egress
  labels:
    {{- include "navra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: navra
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "navra.name" . }}
      ports:
        # Both the Service port and the container targetPort:
        # OVN-Kubernetes evaluates egress policy AFTER service DNAT
        # (backend port), other CNIs may match the declared service
        # port — allow both so gatewayPort can differ from 9315.
        - port: {{ include "navra.gatewayPort" . }}
          protocol: TCP
        - port: 9315
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.netpol.dnsNamespace }}
        {{- if .Values.netpol.dnsPodLabel }}
          podSelector:
            matchLabels:
              {{ $dnsLabelKey }}: {{ $dnsLabelValue | quote }}
        {{- end }}
      {{- if .Values.netpol.dnsRestrictPorts }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- end }}
{{ end }}
