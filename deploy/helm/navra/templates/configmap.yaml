# The gateway config.toml. The [server] section is chart-managed:
# kubernetes wiring, cluster role (NAVRA-194 auto ordinal
# detection), and the shared root identity path. Application config
# (models, permissions, agents) is appended verbatim from
# .Values.extraConfig.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "navra.fullname" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    tcp = "{{ .Values.server.tcp | default "0.0.0.0:9315" }}"
    kubernetes_namespace = "{{ .Release.Namespace }}"
    kubernetes_gateway_service = "{{ include "navra.fullname" . }}"
    kubernetes_gateway_port = {{ include "navra.gatewayPort" . }}
    {{- if .Values.warmPool.enabled }}
    kubernetes_warm_pool = "{{ include "navra.warmPoolName" . }}"
    {{- end }}
    cluster_role = "auto"
    cluster_statefulset = "{{ include "navra.fullname" . }}"
    agent_image = "{{ include "navra.agentImage" . }}"
    {{- if .Values.tls.enabled }}
    {{- if eq .Values.tls.source "spire" }}
    # SPIRE SVIDs via the SPIFFE Helper sidecar (rotating; navra
    # hot-reloads). Client CA = the helper-written SPIRE bundle.
    tls_cert_path = "/svid/tls.crt"
    tls_key_path = "/svid/tls.key"
    tls_client_ca_path = "/svid/ca.crt"
    {{- else }}
    tls_cert_path = "/tls/server/tls.crt"
    tls_key_path = "/tls/server/tls.key"
    tls_client_ca_path = "/tls/ca.crt"
    {{- end }}
    {{- end }}

    [server.identity]
    key_path = "/identity/identity.key"
    {{- if .Values.extraConfig }}

    {{- .Values.extraConfig | nindent 4 }}
    {{- end }}
