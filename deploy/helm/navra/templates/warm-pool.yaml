# Warm pool of pre-warmed navra-agent Sandboxes (NAVRA-195).
#
# The pool keeps warmPool.replicas idle agent pods ready; on
# teammate spawn the gateway creates a SandboxClaim that adopts the
# next warm Sandbox, and the adopted pod polls GET /api/agent/task
# for its task, model assignment, and a fresh per-teammate token.
# The {pool}-bootstrap-token Secret is created here as an EMPTY stub
# (RBAC restricts the gateway to get/patch on exactly this name —
# Kubernetes denies create when resourceNames is set); the gateway
# patches the real short-lived token in at startup and on every
# claim. Do not delete it: the gateway cannot recreate it.
#
# RESIDUAL RISK (documented, accepted for now): the bootstrap token
# in this Secret is readable by anything with namespace-wide Secret
# read (the RBAC only constrains the GATEWAY's writes, not other
# readers). It is zero-capability (no operations/tools) and
# short-lived (24h, rolled forward on each claim), and pool
# adoption is bound at claim time — but a reader can still poll the
# task endpoint as this pool. End-state: replace the shared secret
# with per-pod SVIDs (tls.source=spire already mounts the SPIFFE
# Workload API; the task endpoint would authenticate the pod's
# X509-SVID instead of the pooled token), at which point this
# Secret goes away entirely.
#
# networkPolicyManagement: Unmanaged — the controller's Managed
# policy isolates sandbox pods from all private address space,
# which breaks cluster DNS under OVN-Kubernetes (see NAVRA-196:
# port-restricted egress rules never match the DNS punt path).
# Isolation is provided by the chart's own NetworkPolicy
# (netpol.yaml), which allows egress to the gateway and DNS only.
{{- if .Values.warmPool.enabled }}
# Stub for the pool bootstrap-token Secret the gateway patches
# (see above — RBAC resourceNames require chart-side creation).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "navra.warmPoolName" . }}-bootstrap-token
  labels:
    {{- include "navra.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Overwritten by the gateway with the real token; the empty
  # default just satisfies the Secret schema.
  token: ""
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ include "navra.warmPoolName" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "navra.name" . }}-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        # Selected by the {{ include "navra.fullname" . }}-sandbox-egress
        # NetworkPolicy (NAVRA-196) — same label the cold-create
        # path sets, so one policy isolates both spawn paths.
        app.kubernetes.io/managed-by: navra
    spec:
      automountServiceAccountToken: false
      # Dedicated agent ServiceAccount (serviceaccount.yaml): keeps
      # sandbox SVIDs class-scoped — SPIFFE IDs embed the SA name,
      # so agents don't share the gateway's (or default) SA identity
      # space. The cold-create path (agent_spawn.rs) derives the
      # same name from the gateway Service.
      serviceAccountName: {{ include "navra.fullname" . }}-agent
      restartPolicy: OnFailure  # task redelivery on crash via the poll endpoint
      # Pod-level seccomp (mirrors the cold-create manifest): the
      # container-level profiles below cover per-container, this
      # covers anything injected alongside (sidecars, init).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "navra.agentImage" . }}
          # The tag is mutable — always pull (stale cached images
          # under IfNotPresent caused silent old-code runs).
          imagePullPolicy: {{ .Values.warmPool.image.pullPolicy }}
          env:
            # Per-deployment constants — everything per-spawn comes
            # from the task endpoint.
            - name: NAVRA_ENDPOINT
              {{- if .Values.tls.enabled }}
              value: https://{{ include "navra.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ include "navra.gatewayPort" . }}/mcp
              {{- else }}
              value: http://{{ include "navra.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ include "navra.gatewayPort" . }}/mcp
              {{- end }}
            - name: NAVRA_MODEL_ENDPOINT
              {{- if .Values.tls.enabled }}
              value: https://{{ include "navra.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ include "navra.gatewayPort" . }}/v1
              {{- else }}
              value: http://{{ include "navra.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ include "navra.gatewayPort" . }}/v1
              {{- end }}
            {{- if .Values.tls.enabled }}
            {{- if eq .Values.tls.source "spire" }}
            # Trust the helper-written SPIRE bundle (rotates with the
            # cluster CA): the agent's task-fetch, result-publish,
            # model, and MCP clients honor it.
            - name: NAVRA_TLS_CA_FILE
              value: /svid/ca.crt
            {{- else }}
            # Trust the chart CA (NAVRA-199): the agent's task-fetch,
            # result-publish, model, and MCP clients honor it.
            - name: NAVRA_TLS_CA_FILE
              value: /tls/ca.crt
            {{- end }}
            {{- end }}
            # Pool bootstrap token (minted by the gateway)
            - name: NAVRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "navra.warmPoolName" . }}-bootstrap-token
                  key: token
            # Identity for warm-pool adoption: the gateway maps the
            # adopted Sandbox to the teammate registered for it.
            - name: NAVRA_SANDBOX_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Warm pods may wait a long time before being claimed.
            - name: NAVRA_TASK_POLL_TIMEOUT_SECS
              value: "3600"
          resources:
            {{- toYaml .Values.warmPool.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Writable scratch — required by readOnlyRootFilesystem
            # (the agent's tempfile use lands in /tmp; mirrors the
            # cold-create manifest in agent_spawn.rs).
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            {{- if eq .Values.tls.source "spire" }}
            - name: svid
              mountPath: /svid
              readOnly: true
            {{- else }}
            - name: tls-ca
              mountPath: /tls
              readOnly: true
            {{- end }}
          {{- end }}
        {{- if and .Values.tls.enabled (eq .Values.tls.source "spire") }}
        # SPIFFE Helper sidecar: the agent container only needs the
        # trust bundle (auth is delegated capability tokens), but the
        # helper writes the SVID files alongside it — same volume.
        - name: spiffe-helper
          image: {{ .Values.tls.spire.helperImage }}
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/agent-sockets
              readOnly: true
            - name: svid
              mountPath: /svid
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        {{- end }}
      volumes:
        # Writable scratch for the agent's read-only root filesystem
        # (see volumeMounts above).
        - name: tmp
          emptyDir: {}
        {{- if and .Values.tls.enabled (eq .Values.tls.source "spire") }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svid
          emptyDir: {}
        - name: spiffe-helper-config
          configMap:
            name: {{ include "navra.fullname" . }}-spiffe-helper
        {{- else if .Values.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ include "navra.fullname" . }}-tls-ca
      {{- end }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ include "navra.warmPoolName" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.warmPool.replicas }}
  sandboxTemplateRef:
    name: {{ include "navra.warmPoolName" . }}
{{- end }}
