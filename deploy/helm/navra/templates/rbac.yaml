# RBAC for the gateway's Kubernetes teammate spawning. Everything is
# namespaced and release-scoped — the gateway can only touch
# Sandboxes, SandboxClaims, Secrets, and Pod status/logs in its own
# release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "navra.fullname" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # Warm-pool teammate spawning (NAVRA-195): SandboxClaims adopt
  # pre-warmed Sandboxes from a SandboxWarmPool.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # The gateway maintains the {pool}-bootstrap-token Secret that the
  # pool's SandboxTemplate pulls the warm-pod bootstrap token from.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch"]
  # Backing Pods of teammate Sandboxes: status polling and logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Improves kubectl's error messages on failed spawns.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "navra.fullname" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "navra.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "navra.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
