# SPIRE workload identity (NAVRA-201): register the release's pods
# for X509-SVIDs and configure the SPIFFE Helper sidecars that
# write the rotating SVID + trust bundle to shared volumes.
{{- if and .Values.tls.enabled (eq .Values.tls.source "spire") }}
{{- $fullname := include "navra.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $td := required "tls.spire.trustDomain is required when tls.source=spire" .Values.tls.spire.trustDomain }}
---
# Workload registration, scoped per workload class:
#
# - Gateway pods (the release selector labels) get SVIDs WITH the
#   Service DNS SANs (client-facing Service, headless Service,
#   per-pod coordinator DNS) so standard hostname-verifying clients
#   work. This is the only class that may carry those SANs: an SVID
#   with the gateway Service DNS name can impersonate the gateway
#   server, so handing one to every pod in the namespace (the old
#   namespace-wide selector) made agent sandboxes gateway
#   impersonators.
# - Agent sandbox pods (app.kubernetes.io/managed-by: navra — both
#   warm-pool and cold-created Sandboxes; the gateway pods are
#   managed-by Helm, so they never match) get SVIDs WITHOUT any DNS
#   SAN. They still need registration: the warm template mounts the
#   csi.spiffe.io Workload API socket and the SPIFFE Helper sidecar
#   writes the trust bundle the agent's clients trust — an
#   unregistered pod's CSI mount would never become ready.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
spec:
  className: {{ .Values.tls.spire.className }}
  # The inner PodMeta/PodSpec expressions below are SPIRE
  # controller-manager templates, escaped so Helm passes them
  # through literally.
  spiffeIDTemplate: {{ printf "spiffe://%s/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}" $td | quote }}
  dnsNameTemplates:
    - {{ $fullname }}.{{ $ns }}.svc.cluster.local
    - {{ $fullname }}-headless.{{ $ns }}.svc.cluster.local
    - {{ printf "{{ .PodMeta.Name }}.%s-headless.%s.svc.cluster.local" $fullname $ns | quote }}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ $ns }}
  podSelector:
    matchLabels:
      # Release-scoped, not just name-scoped: the DNS-SAN SVIDs this
      # entry issues can impersonate the gateway, so an arbitrary
      # in-namespace pod that merely copies the app.kubernetes.io/name
      # label (e.g. a second navra deployment sharing the name, or a
      # hand-labelled pod) must NOT match. The instance label pins
      # the selector to this release's gateway pods.
      app.kubernetes.io/name: {{ include "navra.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
---
# Agent sandbox SVIDs: same trust domain, NO DNS SANs (see above).
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "navra.labels" . | nindent 4 }}
spec:
  className: {{ .Values.tls.spire.className }}
  spiffeIDTemplate: {{ printf "spiffe://%s/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}" $td | quote }}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ $ns }}
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: navra
---
# SPIFFE Helper configuration: fetch the workload's X509-SVID over
# the Workload API (CSI-mounted agent socket) and write the cert,
# key, and trust bundle as PEM files. Rotation is handled by navra's
# file-watching TLS acceptor — no signal needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-spiffe-helper
  labels:
    {{- include "navra.labels" . | nindent 4 }}
data:
  helper.conf: |
    agent_address = "/run/spire/agent-sockets/spire-agent.sock"
    cert_dir = "/svid"
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.crt"
{{- end }}
