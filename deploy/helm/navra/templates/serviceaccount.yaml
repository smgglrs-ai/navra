apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "navra.fullname" . }}
  labels:
    {{- include "navra.labels" . | nindent 4 }}
---
# Dedicated ServiceAccount for agent sandbox pods (warm-pool AND
# cold-created Sandboxes — the gateway derives the same
# `<gateway-service>-agent` name in agent_spawn.rs). SPIFFE IDs
# embed the ServiceAccount name, so this keeps sandbox SVIDs in a
# separate identity class from the gateway. No token is ever
# mounted: agents authenticate with delegated navra capability
# tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "navra.fullname" . }}-agent
  labels:
    {{- include "navra.labels" . | nindent 4 }}
automountServiceAccountToken: false
