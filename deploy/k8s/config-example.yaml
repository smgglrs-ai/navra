# Example gateway configuration for the in-cluster deployment.
#
# Replace with your real config (agents, models, personas) — this is
# the minimum that exercises Kubernetes teammate spawning. Model
# inference is external: point NAVRA model entries at a remote API or
# an in-cluster llama.cpp deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: navra-gateway-config
  namespace: navra
data:
  config.toml: |
    [server]
    tcp = "0.0.0.0:9315"

    # Kubernetes teammate spawning: Sandboxes run in this namespace
    # and resolve the gateway via the navra-gateway Service.
    kubernetes_namespace = "navra"
    kubernetes_gateway_service = "navra-gateway"

    # Teammate image: the distroless navra-agent container, pushed to
    # this cluster's internal registry.
    agent_image = "image-registry.openshift-image-registry.svc:5000/navra/navra-agent:latest"

    # Agent identity for MCP clients. Generate the token_hash with:
    #   navra token generate --name lead --permissions dev
    # Store real configs in a Secret, not a ConfigMap.
    [[agents]]
    name = "lead"
    token_hash = "REPLACE_WITH_navra_token_generate_OUTPUT"
    permissions = "dev"
