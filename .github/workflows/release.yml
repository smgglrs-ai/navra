name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header > RELEASE_NOTES.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  build-linux-x86_64:
    name: Build linux-x86_64
    needs: create-release
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make rust cargo alsa-lib-devel pkg-config protobuf-compiler git-core clang-devel cmake

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --bin navra --features embedded
          cargo build --release --target x86_64-unknown-linux-gnu --bin navra-agent

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          TARGET_DIR="target/x86_64-unknown-linux-gnu/release"
          for bin in navra navra-agent; do
            mkdir -p "dist-${bin}"
            cp "${TARGET_DIR}/${bin}" "dist-${bin}/"
            cp LICENSE README.md "dist-${bin}/"
            ARCHIVE="${bin}-${VERSION}-linux-x86_64.tar.gz"
            tar czf "${ARCHIVE}" -C "dist-${bin}" .
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            navra-*.tar.gz
            navra-*.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "navra-*.tar.gz"

  build-linux-aarch64:
    name: Build linux-aarch64
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binaries
        run: |
          cross build --release --target aarch64-unknown-linux-gnu --bin navra --features embedded
          cross build --release --target aarch64-unknown-linux-gnu --bin navra-agent

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          TARGET_DIR="target/aarch64-unknown-linux-gnu/release"
          for bin in navra navra-agent; do
            mkdir -p "dist-${bin}"
            cp "${TARGET_DIR}/${bin}" "dist-${bin}/"
            cp LICENSE README.md "dist-${bin}/"
            ARCHIVE="${bin}-${VERSION}-linux-aarch64.tar.gz"
            tar czf "${ARCHIVE}" -C "dist-${bin}" .
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            navra-*.tar.gz
            navra-*.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "navra-*.tar.gz"

  update-changelog:
    name: Update Changelog
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Regenerate CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          git push
