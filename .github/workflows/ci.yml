name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PII_NER_REPO: protectai/bert-base-NER-onnx
  # Immutable commit revision of the model repo (was the moving `main`
  # branch). Update deliberately, together with the sha256 sums below.
  # Commit 84d28ab2bc28401b4353b26033eb043c8c8a0739 (2026-07-09).
  PII_NER_REVISION: 84d28ab2bc28401b4353b26033eb043c8c8a0739
  PII_NER_DIR: /github/home/.local/share/navra/models/pii-ner

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make rust cargo clippy rustfmt alsa-lib-devel pkg-config protobuf-compiler git-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fedora44-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora44-cargo-

      - name: Cache PII NER model
        uses: actions/cache@v4
        with:
          path: ${{ env.PII_NER_DIR }}
          key: pii-ner-model-${{ env.PII_NER_REPO }}-${{ env.PII_NER_REVISION }}

      - name: Download PII NER model
        run: |
          mkdir -p "$PII_NER_DIR"
          # sha256 of the files at PII_NER_REVISION:
          #   model.onnx   — LFS oid from the Hugging Face API
          #   tokenizer.json — hashed from the downloaded file
          declare -A EXPECTED_SHA256=(
            [model.onnx]=e2165e300f6e0016c1f295bcdee36e084371e1f4f3564cd7e47cb833b58a75b7
            [tokenizer.json]=cb26b43c98e8266ae3e99c2a583cf8315d73b33a17e6b20b4df7ff1f22392d34
          )
          for file in model.onnx tokenizer.json; do
            if [ ! -f "$PII_NER_DIR/$file" ]; then
              echo "Downloading $file ..."
              curl -sL "https://huggingface.co/$PII_NER_REPO/resolve/${PII_NER_REVISION}/$file" -o "$PII_NER_DIR/$file"
            else
              echo "$file already cached"
            fi
            echo "${EXPECTED_SHA256[$file]}  $PII_NER_DIR/$file" | sha256sum -c -
          done

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude navra-server

      - name: Docs
        run: cargo doc --no-deps

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make rust cargo alsa-lib-devel pkg-config protobuf-compiler git-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fedora44-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora44-cargo-release-

      - name: Build release
        run: cargo build --release

  deny:
    name: cargo-deny (advisories bans licenses sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories, bans, licenses, sources
        # Pinned to release v2.1.2 by commit SHA. All four sections
        # of deny.toml are checked: advisories (tracked, commented
        # ignores for unmaintained crates are the sole exceptions),
        # bans (wildcards allowed — see deny.toml for the residual
        # risk and the publish=false follow-up to tighten this),
        # licenses (exact allowlist of the tree's permissive set),
        # and sources (crates.io only).
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories bans licenses sources
